version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: audit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: audit_rag
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit_rag"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    # No ports exposed to host — only reachable by other containers

  qdrant:
    image: qdrant/qdrant:latest
    container_name: audit_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    # No ports exposed to host — only reachable by other containers

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: audit_backend
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage
      - ./backend/logs:/app/logs
    networks:
      - internal
    # Port 8000 not published — Nginx proxies to it over the internal network

  nginx:
    image: nginx:alpine
    container_name: audit_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - internal

  certbot:
    image: certbot/certbot
    container_name: audit_certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  storage_data:
  certbot_certs:
  certbot_www:
